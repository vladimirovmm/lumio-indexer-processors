# This is a template yaml for the indexer processor. It assumes you have a data service
# running locally, for example as part of local testnet you ran with this command:
# aptos node run-local-testnet
health_check_port: 18084
server_config:
  processor_config:
    # type: ans_processor
    # type: nft_metadata_processor

    # type: account_transactions_processor
    # type: default_processor
    # type: events_processor
    # type: fungible_asset_processor
    # type: monitoring_processor
    # type: objects_processor
    # type: stake_processor
    # type: token_v2_processor
    # type: transaction_metadata_processor
